services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4170
      FUNNET_DATA_DIR: /data
      # 내부망에서 http://<server-ip>:4171 로 접속할 수 있도록 세션 쿠키를
      # HTTPS 전용으로 고정하지 않는다. 도메인 HTTPS 접속에서도 쿠키는 정상 전송된다.
      FUNNET_COOKIE_SECURE: "false"
      FUNNET_ADMIN_USER: ${FUNNET_ADMIN_USER:?required}
      FUNNET_ADMIN_PASSWORD: ${FUNNET_ADMIN_PASSWORD:?required}
      FUNNET_ENROLLMENT_KEY: ${FUNNET_ENROLLMENT_KEY:?required}
      ENERCARE_BASE_URL: ${ENERCARE_BASE_URL:-https://dwcon.enercare.co.kr:18443}
      ENERCARE_DWD_SERVER_ID: ${ENERCARE_DWD_SERVER_ID:-FUNNET}
      ENERCARE_DWD_GROUP_ID: ${ENERCARE_DWD_GROUP_ID:-FUNNET}
      ENERCARE_DWD_SERVER_SECRET: ${ENERCARE_DWD_SERVER_SECRET:-}
      ENERCARE_CON_SERVER_SECRET: ${ENERCARE_CON_SERVER_SECRET:-}
    volumes:
      - funnet_data:/data
    ports:
      - "4171:4170"
    networks: [control]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      FUNNET_DOMAIN: ${FUNNET_DOMAIN:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [control]
networks:
  control:
volumes:
  funnet_data:
  caddy_data:
  caddy_config:
