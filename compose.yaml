services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4170
      FUNNET_DATA_DIR: /data
      FUNNET_COOKIE_SECURE: "true"
      FUNNET_ADMIN_USER: ${FUNNET_ADMIN_USER:?required}
      FUNNET_ADMIN_PASSWORD: ${FUNNET_ADMIN_PASSWORD:?required}
      FUNNET_ENROLLMENT_KEY: ${FUNNET_ENROLLMENT_KEY:?required}
    volumes:
      - funnet_data:/data
    networks: [control]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      FUNNET_DOMAIN: ${FUNNET_DOMAIN:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [control]
networks:
  control:
volumes:
  funnet_data:
  caddy_data:
  caddy_config:
